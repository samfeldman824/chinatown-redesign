<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="styles.css" />
  <title>Chinatown on Thayer</title>
</head>
<body>
  <header role="banner">
  <div class="top-bar">
    <div class="logo">
      <a href="/">
        <img src="images/chinatown_logo.png" alt="Chinatown on Thayer" class="logo-image">
      </a>
    </div>
    <nav aria-label="Primary Navigation">
      <ul>
        <li><a href="#menu">Menu</a></li>
        <li><a href="#hours">Hours</a></li>
        <li><a href="#order">Order Now</a></li>
      </ul>
    </nav>
  </div>
</header>

  <main role="main">
    <section class="hero">
      <h1>Welcome to <span class="highlight">Chinatown</span> on 
        <span class="highlight-secondary">Thayer</span>!</h1>
      <p class="tagline"><span class="flash-text">Serving authentic</span> <span class="highlight">Chinese</span> and <span class="highlight-secondary">Asian cuisine</span> made from <span class="flash-text">only the finest ingredients</span></p>
    </section>

    <section id="menu" class="container">
      <h2 class="section-title">Menu Highlights</h2>
      <div class="menu-grid">
        <div class="menu-item">
          <figure>
            <img src="images/noodles.png" alt="Kung Pao Chicken" />
            <figcaption>Shrimp Noodles</figcaption>
          </figure>
        </div>
        <div class="menu-item">
          <figure>
            <img src="images/steak_broccoli.png" alt="Salmon Nigiri" />
            <figcaption>Steak & Broccoli</figcaption>
          </figure>
        </div>
        <div class="menu-item">
          <figure>
            <img src="images/dumplings.png" alt="Beef Lo Mein" />
            <figcaption>Beef Dumplings</figcaption>
          </figure>
        </div>
      </div>
    </section>
  </main>

  <footer role="contentinfo">
    <div class="container">
      <h2 id="hours" class="section-title">Hours & Location</h2>
      <p><strong>Mon–Thu:</strong> 11am–10pm<br>
         <strong>Fri–Sat:</strong> 11am–11pm<br>
         <strong>Sun:</strong> 12pm–9pm</p>
      <p>277 Thayer St, Providence, RI 02906</p>
    </div>
  </footer>
</body>
</html>
